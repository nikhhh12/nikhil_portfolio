<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#spBg)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>
  <text x="80" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">StockPilot AI — Intelligent Inventory &amp; Warehouse Management</text>

  <!-- Sidebar -->
  <rect x="0" y="40" width="180" height="410" fill="#070a12" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="75" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">OVERVIEW</text>
  <rect x="14" y="90" width="152" height="32" rx="6" fill="#1e293b" fill-opacity="0.6"/>
  <text x="32" y="111" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#ffffff">Dashboard</text>
  <text x="32" y="145" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Inventory Items</text>
  <text x="32" y="177" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Stock Transfers</text>
  <text x="32" y="209" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Purchase Orders</text>
  <text x="32" y="241" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">AI RAG Assistant</text>
  <text x="32" y="273" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#64748b">Audit Ledger</text>

  <!-- Metrics row -->
  <g transform="translate(200, 60)">
    <!-- Metric 1 -->
    <rect width="180" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">p95 Product Lookup</text>
    <text x="16" y="54" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">65 ms <tspan font-size="12" fill="#10b981">(-64%)</tspan></text>

    <!-- Metric 2 -->
    <rect x="195" y="0" width="180" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="211" y="26" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">DB Query Reduction</text>
    <text x="211" y="54" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#a855f7">68% <tspan font-size="12" fill="#94a3b8">cache hit</tspan></text>

    <!-- Metric 3 -->
    <rect x="390" y="0" width="185" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="406" y="26" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Test Suite Status</text>
    <text x="406" y="54" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#10b981">27 / 27 Passing</text>
  </g>

  <!-- Chart Card -->
  <g transform="translate(200, 150)">
    <rect width="365" height="175" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Demand Forecast &amp; Moving Average</text>
    <text x="250" y="26" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8">Spring AI + Stats</text>
    
    <!-- Chart area -->
    <path d="M 20 140 L 60 120 L 110 130 L 160 85 L 210 95 L 260 60 L 310 70 L 345 45 L 345 150 L 20 150 Z" fill="url(#chartGrad)"/>
    <path d="M 20 140 L 60 120 L 110 130 L 160 85 L 210 95 L 260 60 L 310 70 L 345 45" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
  </g>

  <!-- AI Assistant Quick Card -->
  <g transform="translate(580, 150)">
    <rect width="195" height="175" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">RAG Assistant</text>
    <rect x="14" y="42" width="167" height="48" rx="6" fill="#1e293b" fill-opacity="0.5"/>
    <text x="22" y="58" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Q: Which SKU needs reorder?</text>
    <text x="22" y="76" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">A: SKU-402 (Z-Score &gt; 2.1)</text>

    <rect x="14" y="100" width="167" height="60" rx="6" fill="#1e293b" fill-opacity="0.3"/>
    <text x="22" y="118" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Vector Store: Chroma</text>
    <text x="22" y="136" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Security: RBAC Tool Scoped</text>
  </g>

  <!-- Tech Bar Bottom -->
  <g transform="translate(200, 345)">
    <rect width="575" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">STACK:</text>
    <text x="80" y="28" font-family="Inter, sans-serif" font-size="11" fill="#38bdf8">Java 17 · Spring Boot 3 · Spring Security · MySQL · Redis · React 18 · TypeScript · Docker · Spring AI</text>
  </g>
</svg>
