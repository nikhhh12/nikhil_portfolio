<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cfBg)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>
  <text x="80" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">CodeForge AI — Competitive Programming &amp; AI Mentorship Platform</text>
  <rect x="680" y="10" width="100" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="696" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">Piston Judge</text>

  <!-- Left: Problem Description Panel -->
  <g transform="translate(20, 56)">
    <rect width="250" height="374" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Title & Difficulty -->
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Longest Sequence</text>
    <rect x="16" y="38" width="58" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="26" y="52" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Medium</text>
    <text x="84" y="52" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Arrays · Hash Table</text>

    <!-- Description -->
    <text x="16" y="80" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">Given an unsorted array of</text>
    <text x="16" y="96" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">integers, find the length of</text>
    <text x="16" y="112" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">the longest consecutive sequence.</text>
    <text x="16" y="132" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Algorithm Target: O(N) Time</text>

    <!-- Example box -->
    <rect x="16" y="146" width="218" height="70" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="164" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">Example 1:</text>
    <text x="24" y="180" font-family="monospace" font-size="10" fill="#e2e8f0">Input: [100, 4, 200, 1, 3, 2]</text>
    <text x="24" y="196" font-family="monospace" font-size="10" fill="#34d399">Output: 4 ([1, 2, 3, 4])</text>

    <!-- Gemini Generator Callout -->
    <rect x="16" y="230" width="218" height="124" rx="6" fill="#1e293b" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="24" y="250" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">AI PROBLEM GENERATOR</text>
    <text x="24" y="270" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Powers draft creation, auto</text>
    <text x="24" y="286" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">testcase generation, and</text>
    <text x="24" y="302" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">reference solution validation</text>
    <text x="24" y="322" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">Powered by Google Gemini</text>
  </g>

  <!-- Center: Monaco Code Editor -->
  <g transform="translate(285, 56)">
    <rect width="295" height="374" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Editor Tab bar -->
    <rect width="295" height="32" rx="8" fill="#070d18"/>
    <rect x="12" y="6" width="90" height="20" rx="4" fill="#1e293b"/>
    <text x="24" y="20" font-family="Inter, sans-serif" font-size="11" fill="#f8fafc">solution.py</text>
    <text x="230" y="20" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Python 3</text>

    <!-- Code content -->
    <g transform="translate(16, 48)">
      <text x="0" y="16" font-family="monospace" font-size="10.5" fill="#f43f5e">def <tspan fill="#38bdf8">longest_consecutive</tspan><tspan fill="#cbd5e1">(nums):</tspan></text>
      <text x="16" y="34" font-family="monospace" font-size="10.5" fill="#cbd5e1">num_set = set(nums)</text>
      <text x="16" y="52" font-family="monospace" font-size="10.5" fill="#cbd5e1">longest = 0</text>
      <text x="16" y="70" font-family="monospace" font-size="10.5" fill="#f43f5e">for <tspan fill="#cbd5e1">n in num_set:</tspan></text>
      <text x="32" y="88" font-family="monospace" font-size="10.5" fill="#f43f5e">if <tspan fill="#cbd5e1">(n - 1) not in num_set:</tspan></text>
      <text x="48" y="106" font-family="monospace" font-size="10.5" fill="#cbd5e1">cur, length = n, 1</text>
      <text x="48" y="124" font-family="monospace" font-size="10.5" fill="#f43f5e">while <tspan fill="#cbd5e1">(cur + 1) in num_set:</tspan></text>
      <text x="64" y="142" font-family="monospace" font-size="10.5" fill="#cbd5e1">cur += 1; length += 1</text>
      <text x="48" y="160" font-family="monospace" font-size="10.5" fill="#cbd5e1">longest = max(longest, length)</text>
      <text x="16" y="178" font-family="monospace" font-size="10.5" fill="#f43f5e">return <tspan fill="#cbd5e1">longest</tspan></text>
    </g>

    <!-- Execution result console -->
    <g transform="translate(12, 252)">
      <rect width="271" height="110" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
      <rect x="12" y="12" width="75" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="22" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">ACCEPTED</text>
      <text x="100" y="26" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Runtime: 42 ms (faster than 89%)</text>
      <text x="14" y="56" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Test Cases: 12 / 12 Passed (Sample + Hidden)</text>
      <text x="14" y="74" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Memory: 18.2 MB</text>
      <text x="14" y="92" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8">Evaluated via Piston Remote Execution Engine</text>
    </g>
  </g>

  <!-- Right: AI Mentor Toolbar & Modes -->
  <g transform="translate(595, 56)">
    <rect width="185" height="374" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1">AI MENTOR SUITE</text>

    <!-- Mentor Toolbar Buttons -->
    <g transform="translate(14, 40)">
      <!-- Button 1 -->
      <rect width="157" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="12" y="20" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Progressive Hints</text>

      <!-- Button 2 -->
      <rect y="40" width="157" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <text x="12" y="60" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Complexity Analyzer</text>

      <!-- Button 3 -->
      <rect y="80" width="157" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <text x="12" y="100" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Dry-Run Visualizer</text>

      <!-- Button 4 -->
      <rect y="120" width="157" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <text x="12" y="140" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Code Debugger</text>

      <!-- Button 5 -->
      <rect y="160" width="157" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <text x="12" y="180" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Interviewer Mode</text>

      <!-- Button 6 -->
      <rect y="200" width="157" height="32" rx="6" fill="#1e293b" fill-opacity="0.5"/>
      <text x="12" y="220" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Edge Case Generator</text>
    </g>

    <!-- Active Hint Preview -->
    <rect x="14" y="280" width="157" height="80" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="298" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#a78bfa">HINT 1 / 3</text>
    <text x="22" y="314" font-family="Inter, sans-serif" font-size="9.5" fill="#cbd5e1">"Can you check if n-1 is</text>
    <text x="22" y="328" font-family="Inter, sans-serif" font-size="9.5" fill="#cbd5e1">in the set to ensure n is</text>
    <text x="22" y="342" font-family="Inter, sans-serif" font-size="9.5" fill="#cbd5e1">the sequence start?"</text>
  </g>
</svg>
