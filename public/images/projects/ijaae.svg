<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ijBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ijBg)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>
  <text x="80" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">IJAAE — Intelligent Job Application Automation Engine</text>
  <rect x="660" y="10" width="120" height="22" rx="11" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="674" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#60a5fa">4-Tier System</text>

  <!-- Service Architecture Status Pills -->
  <g transform="translate(20, 54)">
    <rect width="760" height="44" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <rect x="16" y="10" width="165" height="24" rx="12" fill="#1e293b"/>
    <text x="26" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">1. Frontend (React/Zustand)</text>
    
    <rect x="190" y="10" width="165" height="24" rx="12" fill="#1e293b"/>
    <text x="200" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">2. Backend (Node/Prisma)</text>
    
    <rect x="364" y="10" width="180" height="24" rx="12" fill="#1e293b"/>
    <text x="374" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#34d399">3. AI Core (FastAPI/FAISS)</text>
    
    <rect x="553" y="10" width="190" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="563" y="26" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">4. Playwright (Human Pause)</text>
  </g>

  <!-- Left: Candidate Profile & SBERT Embedding Pipeline -->
  <g transform="translate(20, 110)">
    <rect width="250" height="320" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">RESUME PARSING &amp; SBERT</text>
    
    <rect x="16" y="40" width="218" height="60" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
    <text x="26" y="60" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff">PyMuPDF Text Extraction</text>
    <text x="26" y="78" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Parsed 47 skills, 3 projects, 1 exp</text>

    <rect x="16" y="112" width="218" height="85" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
    <text x="26" y="132" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">Sentence-Transformers</text>
    <text x="26" y="150" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Model: all-MiniLM-L6-v2</text>
    <text x="26" y="168" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Embedding dimension: 384-d dense</text>
    <text x="26" y="184" font-family="Inter, sans-serif" font-size="10" fill="#34d399">Normalized Inner Product Index</text>

    <!-- FAISS Index Summary -->
    <rect x="16" y="210" width="218" height="92" rx="6" fill="#1e293b" fill-opacity="0.3" stroke="#1e293b" stroke-width="1"/>
    <text x="26" y="232" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">FAISS VECTOR MATCHING</text>
    <text x="26" y="252" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Computes cosine similarity</text>
    <text x="26" y="268" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">against incoming job listings</text>
    <text x="26" y="286" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Rank Threshold: &gt;= 85% match</text>
  </g>

  <!-- Center: Job Discovery & Match Results -->
  <g transform="translate(285, 110)">
    <rect width="285" height="320" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">SEMANTIC JOB MATCHES</text>

    <!-- Job Match Item 1 -->
    <g transform="translate(16, 40)">
      <rect width="253" height="78" rx="6" fill="#040711" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Backend Engineer (Node/SQL)</text>
      <text x="14" y="38" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Fintech · Remote · Hyderabad</text>
      <rect x="175" y="10" width="65" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="185" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">94.2%</text>
      <text x="14" y="60" font-family="Inter, sans-serif" font-size="9.5" fill="#38bdf8">Status: Cover Letter Generated</text>
    </g>

    <!-- Job Match Item 2 -->
    <g transform="translate(16, 128)">
      <rect width="253" height="78" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Software Engineer (Java/Spring)</text>
      <text x="14" y="38" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Cloud Corp · Hybrid</text>
      <rect x="175" y="10" width="65" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="185" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#34d399">89.7%</text>
      <text x="14" y="60" font-family="Inter, sans-serif" font-size="9.5" fill="#94a3b8">Status: Queued for Automation</text>
    </g>

    <!-- Job Match Item 3 -->
    <g transform="translate(16, 216)">
      <rect width="253" height="85" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Full Stack Developer (Next.js)</text>
      <text x="14" y="38" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">AI Labs · Remote</text>
      <rect x="175" y="10" width="65" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="185" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">82.1%</text>
      <text x="14" y="60" font-family="Inter, sans-serif" font-size="9.5" fill="#94a3b8">Status: Reviewed &amp; Filtered</text>
    </g>
  </g>

  <!-- Right: Playwright Form Filling & Human Verification -->
  <g transform="translate(585, 110)">
    <rect width="195" height="320" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="1">PLAYWRIGHT ENGINE</text>

    <!-- Verification Card -->
    <rect x="12" y="40" width="171" height="150" rx="6" fill="#040711" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="20" y="50" width="95" height="18" rx="9" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="26" y="63" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#fbbf24">PAUSED: REVIEW</text>
    
    <text x="20" y="86" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Automated Form Fill</text>
    <text x="20" y="104" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Mapped: Name, Email</text>
    <text x="20" y="120" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Cover letter injected</text>
    <text x="20" y="136" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Resume PDF attached</text>

    <!-- Human Action -->
    <rect x="20" y="148" width="151" height="30" rx="6" fill="#059669"/>
    <text x="42" y="167" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Confirm &amp; Submit</text>

    <!-- Cover Letter Generation Box -->
    <g transform="translate(12, 202)">
      <rect width="171" height="106" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#a78bfa">AI COVER LETTER</text>
      <text x="12" y="40" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">Prompt-tuned via OpenAI</text>
      <text x="12" y="56" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">strictly grounded on verified</text>
      <text x="12" y="72" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">resume facts and project</text>
      <text x="12" y="88" font-family="Inter, sans-serif" font-size="9" fill="#34d399">metrics (0 hallucinations).</text>
    </g>
  </g>
</svg>
