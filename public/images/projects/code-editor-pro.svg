<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ideBg)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>
  <text x="80" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Code Editor Pro — AI-Powered Modular Web IDE</text>

  <!-- Left: File Tree -->
  <rect x="0" y="40" width="170" height="410" fill="#080c16" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="72" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">PROJECT EXPLORER</text>
  
  <text x="24" y="102" font-family="monospace" font-size="11" fill="#cbd5e1">📁 src</text>
  <text x="36" y="126" font-family="monospace" font-size="11" fill="#cbd5e1">📁 components</text>
  <text x="48" y="150" font-family="monospace" font-size="11" fill="#38bdf8">📄 Editor.tsx</text>
  <text x="48" y="174" font-family="monospace" font-size="11" fill="#94a3b8">📄 Terminal.tsx</text>
  <text x="36" y="198" font-family="monospace" font-size="11" fill="#cbd5e1">📁 ai</text>
  <text x="48" y="222" font-family="monospace" font-size="11" fill="#94a3b8">📄 gemini.ts</text>
  <text x="24" y="246" font-family="monospace" font-size="11" fill="#94a3b8">📄 package.json</text>
  <text x="24" y="270" font-family="monospace" font-size="11" fill="#94a3b8">📄 tsconfig.json</text>

  <!-- Center: Monaco Code Editor -->
  <g transform="translate(170, 40)">
    <!-- Editor Tab -->
    <rect width="400" height="32" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="130" height="32" fill="#1e293b"/>
    <text x="16" y="20" font-family="monospace" font-size="11" fill="#38bdf8">Editor.tsx ×</text>

    <!-- Code Area -->
    <rect y="32" width="400" height="240" fill="#080d1a"/>
    <text x="15" y="65" font-family="monospace" font-size="11" fill="#64748b">1</text>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#64748b">2</text>
    <text x="15" y="105" font-family="monospace" font-size="11" fill="#64748b">3</text>
    <text x="15" y="125" font-family="monospace" font-size="11" fill="#64748b">4</text>
    <text x="15" y="145" font-family="monospace" font-size="11" fill="#64748b">5</text>
    <text x="15" y="165" font-family="monospace" font-size="11" fill="#64748b">6</text>
    <text x="15" y="185" font-family="monospace" font-size="11" fill="#64748b">7</text>

    <text x="40" y="65" font-family="monospace" font-size="11" fill="#c084fc">import <tspan fill="#38bdf8">{ WebContainer }</tspan> from <tspan fill="#34d399">'@webcontainer/api'</tspan>;</text>
    <text x="40" y="85" font-family="monospace" font-size="11" fill="#c084fc">import <tspan fill="#38bdf8">{ geminiSuggest }</tspan> from <tspan fill="#34d399">'@/ai/gemini'</tspan>;</text>
    <text x="40" y="105" font-family="monospace" font-size="11" fill="#f8fafc"></text>
    <text x="40" y="125" font-family="monospace" font-size="11" fill="#c084fc">export async function <tspan fill="#60a5fa">mountRuntime</tspan>() {</text>
    <text x="56" y="145" font-family="monospace" font-size="11" fill="#f8fafc">const container = await WebContainer.boot();</text>
    <text x="56" y="165" font-family="monospace" font-size="11" fill="#f8fafc">await container.mount(vfsSnapshot);</text>
    <text x="56" y="185" font-family="monospace" font-size="11" fill="#a855f7">// Gemini Ghost-Text active...</text>

    <!-- Bottom: xterm.js Terminal -->
    <rect y="272" width="400" height="138" fill="#04060b" stroke="#1e293b" stroke-width="1"/>
    <text x="15" y="292" font-family="monospace" font-size="10" font-weight="700" fill="#38bdf8">TERMINAL — [xterm.js + WebContainers]</text>
    <text x="15" y="315" font-family="monospace" font-size="10" fill="#34d399">$ node index.js</text>
    <text x="15" y="335" font-family="monospace" font-size="10" fill="#94a3b8">[WebContainers] In-browser Node.js v20.10 initialized.</text>
    <text x="15" y="355" font-family="monospace" font-size="10" fill="#94a3b8">Ready on http://localhost:3000 (0ms latency)</text>
    <text x="15" y="375" font-family="monospace" font-size="10" fill="#60a5fa">WebSocket connection established with Prisma ORM.</text>
  </g>

  <!-- Right: Gemini AI Assistant Panel -->
  <g transform="translate(570, 40)">
    <rect width="230" height="410" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">GEMINI AI ASSISTANT</text>
    
    <rect x="12" y="44" width="206" height="65" rx="6" fill="#1e293b" fill-opacity="0.4"/>
    <text x="20" y="62" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Context Analysis:</text>
    <text x="20" y="80" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Detected Node.js runtime.</text>
    <text x="20" y="96" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Auto-generating server tests...</text>

    <rect x="12" y="120" width="206" height="80" rx="6" fill="#1e293b" fill-opacity="0.4"/>
    <text x="20" y="138" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#34d399">Ghost Text Suggestions</text>
    <text x="20" y="156" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Real-time cursor tracking</text>
    <text x="20" y="174" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Fast low-latency inference</text>
    <text x="20" y="190" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8">Powered by Gemini SDK</text>

    <rect x="12" y="325" width="206" height="65" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <text x="20" y="347" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Modular Architecture</text>
    <text x="20" y="365" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Prisma + MongoDB + NextAuth</text>
    <text x="20" y="379" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">xterm.js + WebContainers</text>
  </g>
</svg>
