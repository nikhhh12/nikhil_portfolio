<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="saiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="agentPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#saiBg)"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#10b981"/>
  <text x="80" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">SmartAIgent — Agentic Work Intake &amp; Execution Engine</text>

  <!-- 7-Stage Pipeline Status Bar -->
  <g transform="translate(20, 56)">
    <rect width="760" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#06b6d4" letter-spacing="1">WORKFLOW PIPELINE</text>
    
    <!-- Stage chips -->
    <rect x="150" y="12" width="75" height="24" rx="12" fill="#1e293b"/>
    <text x="164" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#22d3ee">1. Intake</text>
    
    <rect x="233" y="12" width="95" height="24" rx="12" fill="#1e293b"/>
    <text x="243" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">2. Gemini Zod</text>
    
    <rect x="336" y="12" width="90" height="24" rx="12" fill="#1e293b"/>
    <text x="348" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">3. Planning</text>
    
    <rect x="434" y="12" width="75" height="24" rx="12" fill="#1e293b"/>
    <text x="448" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#34d399">4. Tools</text>
    
    <rect x="517" y="12" width="115" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="527" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">5. Human Review</text>
    
    <rect x="640" y="12" width="105" height="24" rx="12" fill="#1e293b"/>
    <text x="652" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">6. SQLite Trace</text>
  </g>

  <!-- Left: Natural Language Intake + Gemini Structured Output -->
  <g transform="translate(20, 116)">
    <!-- Unstructured Intake Prompt -->
    <rect width="365" height="140" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">RAW UNSTRUCTURED INTAKE</text>
    <rect x="16" y="38" width="333" height="84" rx="6" fill="#040711" stroke="#1e293b" stroke-width="1"/>
    <text x="26" y="58" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">"Met with Altibbe Health. Need updated pricing</text>
    <text x="26" y="74" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">draft by Friday. Create follow-up team task and</text>
    <text x="26" y="90" font-family="Inter, sans-serif" font-size="11" fill="#cbd5e1">remind me next Tuesday to check deployment."</text>
    <text x="26" y="110" font-family="Inter, sans-serif" font-size="10" fill="#38bdf8">Parsed via Google Gemini + Zod Schema Validation</text>

    <!-- Execution Plan & Tool Registry -->
    <g transform="translate(0, 152)">
      <rect width="365" height="154" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">DETERMINISTIC TOOL ACTIONS</text>
      
      <rect x="16" y="36" width="333" height="32" rx="6" fill="#1e293b" fill-opacity="0.4"/>
      <circle cx="30" cy="52" r="4" fill="#34d399"/>
      <text x="42" y="56" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#f8fafc">createTask: "Prepare Altibbe Pricing Doc"</text>
      <text x="280" y="56" font-family="Inter, sans-serif" font-size="10" fill="#34d399">Auto-Exec</text>

      <rect x="16" y="74" width="333" height="32" rx="6" fill="#1e293b" fill-opacity="0.4"/>
      <circle cx="30" cy="90" r="4" fill="#34d399"/>
      <text x="42" y="94" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#f8fafc">createReminder: "Follow up next Tuesday"</text>
      <text x="280" y="94" font-family="Inter, sans-serif" font-size="10" fill="#34d399">Auto-Exec</text>

      <rect x="16" y="112" width="333" height="32" rx="6" fill="#1e293b" fill-opacity="0.4"/>
      <circle cx="30" cy="128" r="4" fill="#60a5fa"/>
      <text x="42" y="132" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#f8fafc">websiteCheck: "Health portal uptime probe"</text>
      <text x="280" y="132" font-family="Inter, sans-serif" font-size="10" fill="#60a5fa">Registered</text>
    </g>
  </g>

  <!-- Right: Human-in-the-Loop Review Queue & Vitest Specs -->
  <g transform="translate(405, 116)">
    <!-- Human Approval Queue Card -->
    <rect width="375" height="180" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="16" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" letter-spacing="1">HUMAN-IN-THE-LOOP APPROVAL</text>
    <rect x="270" y="10" width="90" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="282" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">REVIEW REQ</text>

    <rect x="16" y="38" width="343" height="80" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    <text x="28" y="56" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Sensitive Action: draftCommunication</text>
    <text x="28" y="74" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Target: Altibbe Health (Pricing Update)</text>
    <text x="28" y="92" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Policy: Explicit approval required before delivery</text>

    <!-- Action buttons inside approval card -->
    <rect x="16" y="128" width="105" height="34" rx="6" fill="#059669"/>
    <text x="36" y="150" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Approve</text>
    
    <rect x="131" y="128" width="105" height="34" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="162" y="150" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Edit</text>
    
    <rect x="246" y="128" width="113" height="34" rx="6" fill="#dc2626" fill-opacity="0.2" stroke="#dc2626" stroke-width="1"/>
    <text x="274" y="150" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f87171">Reject</text>

    <!-- Bottom Metrics / Vitest Spec Box -->
    <g transform="translate(0, 192)">
      <rect width="375" height="114" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">PERSISTENCE &amp; TEST SUITE</text>
      
      <rect x="16" y="38" width="165" height="60" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="26" y="58" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Persistence Layer</text>
      <text x="26" y="80" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">SQLite + Drizzle</text>

      <rect x="195" y="38" width="164" height="60" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1"/>
      <text x="205" y="58" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">Vitest Coverage</text>
      <text x="205" y="80" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#10b981">20 / 20 Passing</text>
    </g>
  </g>
</svg>
